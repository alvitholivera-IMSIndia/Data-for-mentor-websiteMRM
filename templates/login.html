{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block body %}<div class="card" style="max-width:380px;margin:80px auto">
<h2 style="margin-top:0">MRM Report</h2>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf() }}">
<label>Email</label><input name="email" type="email" required autofocus style="width:100%;margin-bottom:12px">
<label>Password</label><input name="password" type="password" required style="width:100%;margin-bottom:16px">
<button style="width:100%">Log in</button></form>
<p class="mute">Need access? Ask the admin to create your login.</p></div>{% endblock %}
